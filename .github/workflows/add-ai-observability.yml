name: Add AI observability
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary workflow for live AI execution observability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch AI observability
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/jobs/engine.py'); s = p.read_text()
          old = '''        d["output"] = None if self.output is None else "<stored>"\n        return d'''
          new = '''        # Expose only the compact execution envelope; never expose prompts or secrets.\n        d["output"] = self.output\n        return d'''
          assert old in s; p.write_text(s.replace(old,new,1))
          p = Path('backend/agents_v2/orchestrator.py'); s = p.read_text()
          old = '''                return {"artifacts": result.artifacts,\n                        "statements": result.statements_persisted,\n                        "generation_mode": result.output.generation_mode,\n                        "summary": result.output.summary,\n                        "degraded": result.output.degraded}'''
          new = '''                return {"artifacts": result.artifacts,\n                        "statements": result.statements_persisted,\n                        "generation_mode": result.output.generation_mode,\n                        "summary": result.output.summary,\n                        "degraded": result.output.degraded,\n                        "provider": result.output.provider,\n                        "model": result.output.model,\n                        "prompt_tokens": result.output.prompt_tokens,\n                        "completion_tokens": result.output.completion_tokens,\n                        "duration_ms": result.output.duration_ms,\n                        "tool_calls": [c.to_dict() for c in result.output.tool_calls],\n                        "warnings": result.output.warnings}'''
          assert old in s; p.write_text(s.replace(old,new,1))
          p = Path('frontend/lib/factory-api.ts'); s = p.read_text()
          old = '''  elapsed_seconds: number; trace: {timestamp: string; step: string; status: string; message: string}[];\n};'''
          new = '''  elapsed_seconds: number;\n  results?: Record<string, {step: string; status: string; output?: any; error?: string; elapsed_ms?: number; attempts?: number}>;\n  trace: {timestamp: string; step: string; status: string; message: string}[];\n};'''
          assert old in s; p.write_text(s.replace(old,new,1))
          p = Path('frontend/lib/factory-api.ts'); s = p.read_text()
          old = '''export async function runFactoryStage(id: string, stage: string, background = true) {'''
          new = '''export async function runFactoryStage(id: string, stage: string, background = true, onProgress?: (job: Job) => void) {'''
          assert old in s; s=s.replace(old,new,1)
          old = '''    last = await getFactoryJob(queued.job_id);\n    if (["COMPLETED", "FAILED", "PARTIAL", "CANCELLED"].includes(last.status)) {'''
          new = '''    last = await getFactoryJob(queued.job_id);\n    onProgress?.(last);\n    if (["COMPLETED", "FAILED", "PARTIAL", "CANCELLED"].includes(last.status)) {'''
          assert old in s; p.write_text(s.replace(old,new,1))
          p = Path('frontend/components/EnterpriseFactoryCockpit.tsx'); s = p.read_text()
          s=s.replace("  const [messageKind,setMessageKind]=useState<'info'|'success'|'error'>('info');", "  const [messageKind,setMessageKind]=useState<'info'|'success'|'error'>('info');\n  const [aiActivity,setAiActivity]=useState<any|null>(null);")
          old='''      await runFactoryStage(project.id,stage,true);\n      setMessageKind('success');'''
          new='''      await runFactoryStage(project.id,stage,true,job=>{\n        const exec=job?.results?.execute?.output || {};\n        setAiActivity({stage,status:job.status,step:job.current_step,progress:job.total_steps ? Math.round(job.completed_steps*100/job.total_steps) : 0,...exec});\n      });\n      setMessageKind('success');'''
          assert old in s; s=s.replace(old,new,1)
          old='''    {message && <div className={`efcNotice ${messageKind}`}><CircleAlert size={16}/><span>{message}</span><button onClick={()=>setMessage('')}><X size={15}/></button></div>}'''
          new='''    {message && <div className={`efcNotice ${messageKind}`}><CircleAlert size={16}/><span>{message}</span><button onClick={()=>setMessage('')}><X size={15}/></button></div>}\n    {project && aiActivity && <section className="efcAiActivity"><div className="efcAiActivityHead"><div><span>LIVE AI ACTIVITY</span><h3>{stageLabel(aiActivity.stage)} · {aiActivity.status}</h3></div><span className="aiLiveBadge"><i/> {aiActivity.progress ?? 0}%</span></div><div className="efcAiSteps"><span className={aiActivity.step==='gate'?'active':'done'}>1. Gate & context</span><span className={aiActivity.step==='execute'?'active':aiActivity.progress>=100?'done':''}>2. Evidence analysis</span><span className={aiActivity.progress>=100?'done':''}>3. Structured output</span><span className={aiActivity.progress>=100?'done':''}>4. Persist & trace</span></div>{aiActivity.provider && <div className="efcAiMeta"><b>Provider</b> {aiActivity.provider} <b>Model</b> {aiActivity.model || 'n/a'} <b>Latency</b> {aiActivity.duration_ms ? `${aiActivity.duration_ms} ms` : '—'} <b>Tokens</b> {(aiActivity.prompt_tokens||0)+(aiActivity.completion_tokens||0) || '—'}</div>}{aiActivity.summary && <p className="efcAiSummary">{aiActivity.summary}</p>}{aiActivity.tool_calls?.length ? <div className="efcAiTools"><b>Evidence/tools used</b>{aiActivity.tool_calls.map((c:any,i:number)=><span key={i}>{c.tool || c.name || 'tool'}</span>)}</div>:null}{aiActivity.warnings?.length ? <div className="efcAiWarning">{aiActivity.warnings.join(' · ')}</div>:null}</section>}'''
          assert old in s; p.write_text(s.replace(old,new,1))
          PY
      - name: Commit observability patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/jobs/engine.py backend/agents_v2/orchestrator.py frontend/lib/factory-api.ts frontend/components/EnterpriseFactoryCockpit.tsx
          git commit -m "Add live AI execution observability"
          git push
          git rm .github/workflows/add-ai-observability.yml
          git commit -m "Remove temporary observability workflow"
          git push
