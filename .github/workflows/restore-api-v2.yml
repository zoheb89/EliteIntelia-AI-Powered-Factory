name: Restore API v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.event.head_commit.message == 'Restore complete API v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore API v2 from known-good commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout 94c55fb22c98ae0814393e90b42d39ffa8af5cb9 -- backend/core/api_v2.py
          git add backend/core/api_v2.py
          git commit -m "Restore API v2 from known-good version"
          git push
