name: Restore API v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.event.head_commit.message == 'Restore complete API v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore API v2 from known-good commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout 4cf75cda4445e51e5a8e9c5479be7c9069570e4d -- backend/core/api_v2.py
          git add backend/core/api_v2.py
          git commit -m "Restore API v2 from known-good version"
          git push
