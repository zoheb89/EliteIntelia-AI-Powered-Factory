services:
  - type: web
    name: eliteintelia-ai-powered-factory-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_ALLOWED_ORIGINS
        value: https://eliteintelia-ai-powered-factory.onrender.com
      - key: DATABRICKS_HOST
        sync: false
      - key: DATABRICKS_TOKEN
        sync: false
      - key: DATABRICKS_WAREHOUSE_ID
        sync: false
      - key: ELITEINTELIA_LLM_BASE_URL
        sync: false
      - key: ELITEINTELIA_LLM_MODEL
        sync: false
      - key: ELITEINTELIA_LLM_API_KEY
        sync: false
      - key: ELITEINTELIA_LLM_PROVIDER
        sync: false
      - key: ELITEINTELIA_LLM_AUTH_HEADER
        value: x-api-key
      - key: ELITEINTELIA_LLM_AUTH_SCHEME
        value: none
      - key: ELITEINTELIA_WORKSPACE_ID
        sync: false
      - key: ELITEINTELIA_INCLUDE_WORKSPACE_ID
        value: "false"
      - key: ELITEINTELIA_IMAGE_API_KEY
        sync: false
      - key: ELITEINTELIA_IMAGE_BASE_URL
        value: https://assets.generative.engine.capgemini.com/v1/generate
      - key: ELITEINTELIA_IMAGE_MODEL
        value: gemini-2.5-flash-image
      - key: ELITEINTELIA_IMAGE_PROVIDER
        value: vertexai
      - key: AI_PROVIDER
        value: capgemini
      - key: LLM_TIMEOUT_SECONDS
        value: "90"
      - key: LLM_MAX_TOKENS
        value: "1200"
      - key: LLM_TEMPERATURE
        value: "0.0"
      - key: LLM_DEFAULT_PROVIDER
        value: azure
      - key: CINVENT_ALLOW_MUTATIONS
        value: "false"
      - key: CINVENT_DB_PATH
        value: /tmp/cinvent.db
      - key: AUTH_REQUIRED
        value: "false"
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TOKEN_TTL
        value: "43200"
      - key: PYTHON_VERSION
        value: "3.11.9"

  - type: web
    name: eliteintelia-ai-powered-factory
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://eliteintelia-ai-powered-factory-api.onrender.com
