services:
  - type: web
    name: eliteintelia-ai-powered-factory-api
    plan: free
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_ALLOWED_ORIGINS
        value: https://eliteintelia-ai-powered-factory.onrender.com
      - key: DATABRICKS_HOST
        sync: false
      - key: DATABRICKS_TOKEN
        sync: false
      - key: DATABRICKS_WAREHOUSE_ID
        sync: false
      - key: ELITEINTELIA_LLM_BASE_URL
        sync: false
      - key: ELITEINTELIA_LLM_MODEL
        sync: false
      - key: ELITEINTELIA_LLM_API_KEY
        sync: false
      - key: ELITEINTELIA_LLM_PROVIDER
        sync: false
      - key: ELITEINTELIA_LLM_AUTH_HEADER
        value: x-api-key
      - key: ELITEINTELIA_LLM_AUTH_SCHEME
        value: none
      - key: ELITEINTELIA_WORKSPACE_ID
        sync: false
      - key: ELITEINTELIA_INCLUDE_WORKSPACE_ID
        value: "false"
      - key: CINVENT_ALLOW_MUTATIONS
        value: "false"
      - key: CINVENT_DB_PATH
        value: /tmp/cinvent.db
      - key: AUTH_REQUIRED
        value: "false"
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TOKEN_TTL
        value: "43200"

  - type: web
    name: eliteintelia-ai-powered-factory
    plan: free
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://eliteintelia-ai-powered-factory-api.onrender.com
