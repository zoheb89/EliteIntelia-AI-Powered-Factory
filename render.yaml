services:
  - type: web
    name: eliteintelia-ai-powered-factory-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT

  - type: web
    name: eliteintelia-ai-powered-factory
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://eliteintelia-ai-powered-factory-api.onrender.com
