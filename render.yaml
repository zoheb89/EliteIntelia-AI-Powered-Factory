services:
  - type: web
    name: eliteintelia-intelligence-factory-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: https://eliteintelia-intelligence-factory.onrender.com
      - key: FRONTEND_ALLOWED_ORIGINS
        value: https://eliteintelia-intelligence-factory.onrender.com
      - key: DATABRICKS_HOST
        sync: false
      - key: DATABRICKS_TOKEN
        sync: false
      - key: DATABRICKS_WAREHOUSE_ID
        sync: false
      - key: LLM_PROVIDERS
        sync: false
      - key: LLM_DEFAULT_PROVIDER
        sync: false
      - key: ELITEINTELIA_LLM_BASE_URL
        sync: false
      - key: ELITEINTELIA_LLM_MODEL
        sync: false
      - key: ELITEINTELIA_LLM_API_KEY
        sync: false
      - key: ELITEINTELIA_LLM_PROVIDER
        sync: false
      - key: ELITEINTELIA_WORKSPACE_ID
        sync: false
      - key: ELITEINTELIA_INCLUDE_WORKSPACE_ID
        sync: false
      - key: CINVENT_ALLOW_MUTATIONS
        value: "false"
      - key: CINVENT_DB_PATH
        value: /var/data/cinvent.db
      - key: AUTH_REQUIRED
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_TOKEN_TTL
        value: "43200"
    disk:
      name: cinvent-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: eliteintelia-intelligence-factory
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://eliteintelia-intelligence-factory-api.onrender.com
